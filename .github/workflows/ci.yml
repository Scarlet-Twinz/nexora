name: Nexora CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nexora"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: nexora-ci-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nexora/db exec prisma generate

      - name: Apply Prisma migrations
        run: pnpm --filter @nexora/db exec prisma migrate deploy

      - name: Build API
        run: pnpm --filter @nexora/api build

      - name: Build worker
        run: pnpm --filter worker build

      - name: Build web
        run: pnpm --filter web build

      - name: Create non-bypass application database role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d nexora -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nexora_app') THEN
              CREATE ROLE nexora_app LOGIN PASSWORD 'nexora_app' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT CONNECT ON DATABASE nexora TO nexora_app;
          GRANT USAGE ON SCHEMA public TO nexora_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO nexora_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO nexora_app;
          SQL

      - name: Verify PostgreSQL tenant isolation
        env:
          DATABASE_URL: postgresql://nexora_app:nexora_app@localhost:5432/nexora
        run: pnpm --filter @nexora/api test:tenant-isolation
